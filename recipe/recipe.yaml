schema_version: 1

context:
  version: "3.8.0"

package:
  name: pyproj
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyproj/pyproj-${{ version }}.tar.gz
  sha256: efa59725bba68bf97fa808b61302df32934acdceb6a5c92a8dd0e71dc266a876

build:
  number: 0
  skip: match(python, "<3.12")
  python:
    entry_points:
      - pyproj=pyproj.__main__:main

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - cython
    - proj
    - setuptools
  run:
    - python
    - proj
    - certifi

tests:
  - python:
      imports:
        - pyproj
      pip_check: true
  - files:
      source:
        - test
    requirements:
      run:
        # NumPy and Shapely are not yet available for Windows ARM64.
        - if: not (win and arm64)
          then:
            - pytest
            - shapely
            - numpy
    script:
      - pyproj --verbose
      - if: unix
        then:
          - export "PROJ_NETWORK=ON"
          - export "PYPROJ_GLOBAL_CONTEXT=ON"
      - if: win
        then:
          - set "PROJ_NETWORK=ON"
          - set "PYPROJ_GLOBAL_CONTEXT=ON"
      - if: ppc64le
        then: projsync --file us_noaa_nadcon5_nad27_nad83_1986_conus.tif
      - if: not (win and arm64)
        then: python -m pytest -v -s

about:
  license: MIT
  license_file:
    - LICENSE
    - LICENSE_proj
  summary: Python interface to PROJ library
  homepage: https://github.com/pyproj4/pyproj

extra:
  recipe-maintainers:
    - djhoese
    - mingwandroid
    - ocefpaf
    - snowman2
    - jorisvandenbossche
    - xylar
    - zklaus
